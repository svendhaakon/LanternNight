<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lantern Night</title>
<style>
:root{--night:#0f1230;--ink:#f6efd9;--glow:#ffc94a;--fly:#c8ff7a;--bat:#ff5f7e;--muted:#9aa0d0;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#0f1230}}
:root[data-theme="dark"]{--night:#0f1230}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:none}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;font-size:20px;pointer-events:none}
.bar{width:min(42vw,220px);height:12px;border-radius:6px;background:#ffffff1f;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--glow);transition:width .1s}
.panel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:#0f1230cc}
.panel h1{font-size:clamp(40px,9vw,76px);margin:0;color:var(--glow);font-weight:600;letter-spacing:.01em}
.panel p{margin:0;max-width:34ch;line-height:1.5;color:var(--muted);font-size:18px}
button{font:inherit;font-size:20px;padding:12px 28px;border-radius:999px;border:0;background:var(--glow);color:#2a1d00;cursor:pointer;font-weight:600}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud"><span id="score">0</span><div class="bar"><i id="lit"></i></div><span id="best">Best 0</span></div>
<div class="panel" id="panel">
  <h1 id="title">Lantern Night</h1>
  <p id="msg">Your lantern is fading. Catch fireflies to keep it burning. Bats hide in the dark, and you only see them when they’re in your light.</p>
  <button id="go">Start</button>
  <p>Move with mouse, touch, or arrow keys.</p>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

let best=0;try{best=+localStorage.getItem('lantern-best')||0}catch(e){}
$('best').textContent='Best '+best;

let p,flies,bats,sparks,energy,score,combo,comboT,t,running=false,target={x:0,y:0},keys={};
function reset(){
  p={x:W/2,y:H/2};target={x:W/2,y:H/2};
  flies=[];bats=[];sparks=[];energy=100;score=0;combo=0;comboT=0;t=0;
  for(let i=0;i<7;i++)spawnFly();
}
function spawnFly(){flies.push({x:Math.random()*W,y:Math.random()*H,a:Math.random()*6.28,s:20+Math.random()*30,ph:Math.random()*6})}
function spawnBat(){
  const side=Math.floor(Math.random()*4);
  const x=side<2?(side?W+30:-30):Math.random()*W, y=side>=2?(side==2?-30:H+30):Math.random()*H;
  bats.push({x,y,vx:0,vy:0,ph:Math.random()*6});
}
function radius(){return 50+energy*1.7}

addEventListener('pointermove',e=>{target.x=e.clientX;target.y=e.clientY});
addEventListener('pointerdown',e=>{target.x=e.clientX;target.y=e.clientY});
addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key]=false});

function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*120;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.6,col})}}

function end(){
  running=false;
  if(score>best){best=score;try{localStorage.setItem('lantern-best',best)}catch(e){}}
  $('best').textContent='Best '+best;
  $('title').textContent=energy<=0?'Lights out':'Caught by a bat';
  $('msg').textContent='You caught '+score+' firefl'+(score==1?'y':'ies')+'. Best is '+best+'.';
  $('go').textContent='Play again';
  $('panel').classList.remove('hide');
}

let last=0;
function loop(now){
  const dt=Math.min((now-last)/1000||0,.05);last=now;
  if(running)update(dt);
  draw();
  requestAnimationFrame(loop);
}
function update(dt){
  t+=dt;
  const kx=(keys.ArrowRight?1:0)-(keys.ArrowLeft?1:0),ky=(keys.ArrowDown?1:0)-(keys.ArrowUp?1:0);
  if(kx||ky){target.x=Math.max(0,Math.min(W,target.x+kx*420*dt));target.y=Math.max(0,Math.min(H,target.y+ky*420*dt))}
  p.x+=(target.x-p.x)*Math.min(1,dt*7);p.y+=(target.y-p.y)*Math.min(1,dt*7);
  energy-=dt*(4+Math.min(t/25,5));
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  const R=radius();
  for(const f of flies){
    f.a+=(Math.random()-.5)*dt*4;f.x+=Math.cos(f.a)*f.s*dt;f.y+=Math.sin(f.a)*f.s*dt;f.ph+=dt*3;
    if(f.x<0||f.x>W)f.a=Math.PI-f.a;if(f.y<0||f.y>H)f.a=-f.a;
    f.x=Math.max(0,Math.min(W,f.x));f.y=Math.max(0,Math.min(H,f.y));
  }
  for(let i=flies.length-1;i>=0;i--){
    const f=flies[i];
    if(Math.hypot(f.x-p.x,f.y-p.y)<22){
      combo=comboT>0?combo+1:1;comboT=2;
      score+=1;energy=Math.min(100,energy+12+Math.min(combo,5));
      burst(f.x,f.y,'#c8ff7a',14);flies.splice(i,1);spawnFly();
    }
  }
  const want=Math.min(1+Math.floor(t/12),7);
  if(bats.length<want&&Math.random()<dt*1.2)spawnBat();
  const speed=70+Math.min(t*2,90);
  for(const b of bats){
    const dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;
    b.vx+=(dx/d*speed-b.vx)*dt*1.4;b.vy+=(dy/d*speed-b.vy)*dt*1.4;
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.ph+=dt*14;
    if(d<20){burst(p.x,p.y,'#ff5f7e',30);end();return}
  }
  for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.l-=dt;if(s.l<=0)sparks.splice(i,1)}
  if(energy<=0){energy=0;end()}
  $('score').textContent=score+(combo>1?'  ×'+combo:'');
  $('lit').style.width=energy+'%';
}
function draw(){
  ctx.clearRect(0,0,W,H);
  if(!p)return;
  const R=running||energy>0?radius():40;
  // ground hints
  ctx.fillStyle='#161a42';ctx.fillRect(0,0,W,H);
  // fireflies (always faintly visible)
  for(const f of flies){
    const g=.5+.5*Math.sin(f.ph);
    ctx.fillStyle='rgba(200,255,122,'+(.35+g*.6)+')';
    ctx.beginPath();ctx.arc(f.x,f.y,3+g*2,0,6.28);ctx.fill();
    ctx.fillStyle='rgba(200,255,122,'+(.08+g*.1)+')';
    ctx.beginPath();ctx.arc(f.x,f.y,14,0,6.28);ctx.fill();
  }
  // bats, only visible in the light
  for(const b of bats){
    if(Math.hypot(b.x-p.x,b.y-p.y)>R)continue;
    const w=Math.sin(b.ph)*9;
    ctx.fillStyle='#ff5f7e';
    ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-16,b.y-6-w);ctx.lineTo(b.x-6,b.y+4);
    ctx.lineTo(b.x+6,b.y+4);ctx.lineTo(b.x+16,b.y-6-w);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,6,0,6.28);ctx.fill();
  }
  for(const s of sparks){ctx.globalAlpha=Math.max(0,s.l/.6);ctx.fillStyle=s.col;ctx.fillRect(s.x-2,s.y-2,4,4)}
  ctx.globalAlpha=1;
  // darkness with a hole for the lantern
  const flick=running?Math.sin(performance.now()/90)*3:0;
  const g=ctx.createRadialGradient(p.x,p.y,R*.15,p.x,p.y,R+flick);
  g.addColorStop(0,'rgba(8,9,26,0)');g.addColorStop(.7,'rgba(8,9,26,.55)');g.addColorStop(1,'rgba(8,9,26,.97)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // warm glow + lantern
  const w=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,R*.6);
  w.addColorStop(0,'rgba(255,201,74,.35)');w.addColorStop(1,'rgba(255,201,74,0)');
  ctx.fillStyle=w;ctx.beginPath();ctx.arc(p.x,p.y,R*.6,0,6.28);ctx.fill();
  ctx.fillStyle='#ffc94a';ctx.beginPath();ctx.arc(p.x,p.y,9,0,6.28);ctx.fill();
  ctx.fillStyle='#fff6cf';ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill();
}
$('go').onclick=()=>{reset();$('panel').classList.add('hide');running=true;$('score').textContent='0'};
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
